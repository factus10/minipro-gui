[project]
name = "minipro-gui"
version = "0.1.0"
description = "A friendly graphical front end for the minipro chip programmer tool"
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.11.2",
]

[project.scripts]
minipro-gui = "minipro_gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minipro_gui"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
